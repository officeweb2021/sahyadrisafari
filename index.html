<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sahyadri Safari Co. | Maharashtra 36-District Interactive Expedition Map</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- D3.js & TopoJSON for realistic district cartography -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <!-- Google Fonts: Inter, Playfair Display & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      background-color: #F4F6F9;
      color: #1E293B;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .font-display {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-marathi {
      font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
    }

    /* Map container positioning with increased size, clean padding and zero gap below */
    #mapContainer {
      position: relative;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px;
      padding-bottom: 0px;
      margin-bottom: 0px;
    }

    /* =========================================================================
       MORNING -> AFTERNOON -> SUNSET -> EVENING ANIMATED BANNER SKY
       ========================================================================= */
    .safari-sky-banner {
      position: relative;
      transition: background 1.6s ease;
    }

    /* Automatic 36-second continuous Morning-to-Evening sky cycle */
    .sky-auto {
      animation: morningToEveningSky 36s ease-in-out infinite;
    }

    @keyframes morningToEveningSky {
      0%, 100% {
        /* Morning Dawn */
        background: linear-gradient(135deg, #FF9A76 0%, #FFD89B 38%, #7DD3FC 80%, #1E3A8A 100%);
      }
      30% {
        /* Crisp Sahyadri Midday */
        background: linear-gradient(135deg, #0284C7 0%, #38BDF8 45%, #BAE6FD 85%, #0F766E 100%);
      }
      62% {
        /* Golden Sunset Dusk */
        background: linear-gradient(135deg, #7C2D12 0%, #EA580C 38%, #F59E0B 72%, #311042 100%);
      }
      84% {
        /* Starlit Sahyadri Evening / Night */
        background: linear-gradient(135deg, #060B19 0%, #0F172A 48%, #1E1B4B 85%, #064E3B 100%);
      }
    }

    .sky-morning {
      background: linear-gradient(135deg, #FF9A76 0%, #FFD89B 42%, #7DD3FC 85%, #1E40AF 100%);
    }
    .sky-noon {
      background: linear-gradient(135deg, #0369A1 0%, #0EA5E9 48%, #7DD3FC 88%, #0F766E 100%);
    }
    .sky-sunset {
      background: linear-gradient(135deg, #7C2D12 0%, #EA580C 40%, #F59E0B 75%, #3B0764 100%);
    }
    .sky-evening {
      background: linear-gradient(135deg, #050914 0%, #0F172A 50%, #1E1B4B 85%, #064E3B 100%);
    }

    /* Animated Sun / Moon Celestial Orb */
    .celestial-orb {
      animation: sunArcMove 36s ease-in-out infinite;
    }

    @keyframes sunArcMove {
      0%, 100% {
        transform: translate(0px, 38px) scale(0.95);
        background: radial-gradient(circle, #FFFBEB 15%, #FDE047 55%, rgba(251, 146, 60, 0) 75%);
        box-shadow: 0 0 55px 18px rgba(253, 224, 71, 0.55);
      }
      30% {
        transform: translate(180px, -24px) scale(1.08);
        background: radial-gradient(circle, #FFFFFF 20%, #FEF08A 60%, rgba(254, 240, 138, 0) 78%);
        box-shadow: 0 0 70px 24px rgba(254, 249, 195, 0.65);
      }
      62% {
        transform: translate(360px, 34px) scale(1.02);
        background: radial-gradient(circle, #FEF3C7 10%, #FB923C 52%, rgba(234, 88, 12, 0) 76%);
        box-shadow: 0 0 65px 22px rgba(249, 115, 22, 0.65);
      }
      84% {
        transform: translate(220px, -14px) scale(0.82);
        background: radial-gradient(circle, #F8FAFC 35%, #CBD5E1 65%, rgba(148, 163, 184, 0) 78%);
        box-shadow: 0 0 40px 12px rgba(226, 232, 240, 0.45);
      }
    }

    /* Twinkling Evening Stars Layer */
    .evening-stars {
      animation: starsVisibility 36s ease-in-out infinite;
    }

    @keyframes starsVisibility {
      0%, 55%, 100% { opacity: 0; }
      75%, 92% { opacity: 0.9; }
    }

    /* Gentle Drifting Mist / Clouds */
    .cloud-drift-slow {
      animation: cloudDrift 48s linear infinite;
    }
    .cloud-drift-fast {
      animation: cloudDrift 32s linear infinite reverse;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(-4%); }
      50% { transform: translateX(4%); }
      100% { transform: translateX(-4%); }
    }

    /* =========================================================================
       REALISTIC CARTOGRAPHIC MAP STYLING
       ========================================================================= */
    .district-path {
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 1.35px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      filter: url(#districtInnerBevel);
      transition: fill 0.22s ease, stroke 0.18s ease, stroke-width 0.18s ease, opacity 0.22s ease, filter 0.22s ease;
    }

    /* Subtle visual cursor hint on hover without opening or shifting popup state */
    .district-path:not(.active-selected):hover {
      stroke: #0F172A;
      stroke-width: 2.3px;
      filter: url(#districtInnerBevel) brightness(1.07) saturate(1.12);
    }

    /* Clicked District Glowing Border Highlight */
    .district-path.active-selected {
      stroke: #F59E0B;
      stroke-width: 4px;
      filter: brightness(1.08) saturate(1.15) drop-shadow(0 0 12px rgba(245, 158, 11, 0.95)) drop-shadow(0 3px 6px rgba(15, 23, 42, 0.45));
      animation: selectedDistrictPulse 2.2s ease-in-out infinite;
    }

    @keyframes selectedDistrictPulse {
      0%, 100% {
        stroke: #F59E0B;
        stroke-width: 3.8px;
      }
      50% {
        stroke: #FEF08A;
        stroke-width: 4.8px;
      }
    }

    .district-path.dimmed {
      opacity: 0.22;
    }

    .district-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.015em;
      fill: #0F172A;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.96);
      stroke-width: 1px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* National Highway Route Graphics Styling */
    .nh-highway-line {
      fill: none;
      stroke: #E11D48;
      stroke-width: 2.4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 4;
      opacity: 0.78;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.85));
    }

    .nh-shield {
      font-size: 8px;
      font-weight: 900;
      fill: #FFFFFF;
      text-anchor: middle;
      pointer-events: none;
    }

    .graticule-line {
      fill: none;
      stroke: rgba(148, 163, 184, 0.28);
      stroke-width: 0.85px;
      stroke-dasharray: 3 3;
      pointer-events: none;
    }

    .coastal-glow-outline {
      fill: none;
      stroke: rgba(14, 165, 233, 0.32);
      stroke-width: 10px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .district-famous-icon {
      font-size: 13px;
      text-anchor: middle;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.35));
    }

    .district-famous-icon {
      font-size: 12px;
      text-anchor: middle;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(15, 23, 42, 0.3));
    }

    #maharashtraSvg {
      cursor: pointer;
    }

    /* Right Panel Highlight Pulse when District is Clicked */
    @keyframes listHighlightPulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.65); }
      60% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15); }
    }
    .panel-flash {
      animation: listHighlightPulse 0.85s ease-out;
    }

    @keyframes rightPopupSlideIn {
      0% {
        opacity: 0;
        transform: translate(28px, -50%) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translate(0, -50%) scale(1);
      }
    }
    .right-popup-enter {
      animation: rightPopupSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes middleRightPanelFlash {
      0% {
        transform: translateY(-50%) scale(1);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.65);
      }
      60% {
        transform: translateY(-50%) scale(1);
        box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
      }
      100% {
        transform: translateY(-50%) scale(1);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
      }
    }
    .middle-right-flash {
      animation: middleRightPanelFlash 0.85s ease-out forwards;
    }

    /* Responsive positioning for Welcome Brand Title: Bottom-aligned on Mobile, Middle-Right on Desktop */
    .welcome-brand-responsive {
      bottom: 72px;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
    }
    @media (min-width: 1024px) {
      .welcome-brand-responsive {
        top: calc((100vh - 58px) / 2);
        bottom: auto;
        left: auto;
        right: clamp(20px, 3vw, 48px);
        transform: translateY(-50%);
      }
    }

    /* Realistic Nature Background Slideshow Zoom & Crossfade */
    @keyframes natureKenBurns {
      0% { transform: scale(1.03) translate(0%, 0%); }
      50% { transform: scale(1.1) translate(-1.2%, -0.8%); }
      100% { transform: scale(1.03) translate(0%, 0%); }
    }
    .nature-slide-motion {
      animation: natureKenBurns 22s ease-in-out infinite;
    }

    @keyframes ambientAuroraPulse {
      0%, 100% { opacity: 0.72; transform: scale(1); }
      50% { opacity: 0.92; transform: scale(1.06); }
    }
    .ambient-aurora-glow {
      animation: ambientAuroraPulse 14s ease-in-out infinite;
    }

    /* Animated Tourist Car Road Strip */
    @keyframes roadCarDrive {
      0% { transform: translateX(-140px); }
      100% { transform: translateX(calc(100vw + 140px)); }
    }
    .road-car-anim {
      animation: roadCarDrive 14s linear infinite;
    }

    @keyframes roadStripeMove {
      0% { background-position: 0 0; }
      100% { background-position: -80px 0; }
    }
    .road-stripes {
      background-image: linear-gradient(90deg, #FACC15 55%, transparent 55%);
      background-size: 40px 4px;
      animation: roadStripeMove 0.85s linear infinite;
    }

    /* Route Line between From & To Districts on Map */
    .safari-route-line {
      fill: none;
      stroke: #0F172A;
      stroke-width: 3.5px;
      stroke-linecap: round;
      stroke-dasharray: 8 6;
      pointer-events: none;
      filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.95));
      animation: routeDashFlow 1.2s linear infinite;
    }

    @keyframes routeDashFlow {
      to { stroke-dashoffset: -28; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748B; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col selection:bg-amber-400 selection:text-slate-950">

  <!-- =========================================================================
       FULL-SCREEN 36-DISTRICT COLORFUL MAHARASHTRA MAP & FLOATING POPUP
       ========================================================================= -->
  <section id="bannerSection" class="relative overflow-hidden h-screen w-full flex flex-col justify-between p-0 bg-gradient-to-br from-slate-50 via-stone-100 to-sky-50">
    <!-- Main Banner Workspace Content with Expanded Map proportions -->
    <div class="max-w-[1800px] w-full mx-auto relative z-10 flex-1 flex flex-col min-h-0 px-2 sm:px-4 pt-1 pb-0">
      <div id="activeCategoryBadge" class="hidden self-start mb-0.5 px-3 py-0.5 rounded-full bg-amber-400 text-slate-950 text-xs font-black uppercase shadow-lg">All Themes</div>

      <!-- Subtle Network Status Pill (only visible briefly if fallback cartography is used) -->
      <div id="mapNetworkStatus" class="hidden absolute top-2.5 right-3 z-20 px-2.5 py-1 rounded-full bg-white/90 backdrop-blur-md border border-slate-200 shadow-xs text-[11px] font-bold text-slate-600 flex items-center gap-1.5">
        <span id="mapStatusDot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="mapStatusText">Offline / Built-in Map Ready</span>
      </div>

      <div class="flex-1 flex flex-col min-h-0">
        <div class="w-full bg-transparent flex flex-col overflow-hidden flex-1 min-h-0">
          <div id="mapContainer" class="relative flex-1 w-full h-full bg-transparent overflow-hidden select-none pb-0 mb-0">
            <svg id="maharashtraSvg" class="w-full h-full block absolute inset-0"></svg>

            <!-- Compass Rose (Top Left) -->
            <div class="absolute top-2.5 left-2.5 pointer-events-none flex items-center z-10">
              <div class="w-9 h-9 rounded-full bg-white/95 border border-slate-300 shadow-md flex items-center justify-center shrink-0">
                <svg viewBox="0 0 40 40" class="w-6 h-6">
                  <circle cx="20" cy="20" r="17" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="2,2"/>
                  <polygon points="20,4 24,20 20,17 16,20" fill="#D97706"/>
                  <polygon points="20,36 24,20 20,23 16,20" fill="#475569"/>
                  <text x="20" y="11" text-anchor="middle" font-size="6.5" font-weight="900" fill="#0F172A">N</text>
                </svg>
              </div>
            </div>

            <!-- INITIAL WELCOME BRANDING (BELOW MAP ON MOBILE, MIDDLE-RIGHT ON DESKTOP) -->
            <div id="welcomeBrandBanner" class="welcome-brand-responsive fixed z-30 pointer-events-none select-none inline-flex flex-col w-max max-w-[92vw] transition-opacity duration-300">
              <span class="font-display text-base sm:text-xl lg:text-2xl font-bold text-slate-900 leading-none text-left drop-shadow-[0_1px_6px_rgba(255,255,255,0.95)]">
                The
              </span>
              <h1 class="font-display text-3xl sm:text-5xl lg:text-[75px] font-black tracking-tight text-slate-900 leading-[1.08] drop-shadow-[0_2px_10px_rgba(255,255,255,0.95)]">
                Sahyadri Safari
              </h1>
              <p class="mt-1 text-sm sm:text-lg lg:text-2xl font-bold tracking-wide text-rose-500 text-right drop-shadow-[0_1px_6px_rgba(255,255,255,0.95)]">
                - Tour N Travaller-
              </p>
            </div>

            <!-- FLOATING ON-MAP MIDDLE-RIGHT FROSTED GLASS POPUP -->
            <aside id="districtPlacesPanel" style="top: calc((100vh - 58px) / 2); right: clamp(16px, 2.5vw, 36px); left: auto; transform: translateY(-50%); width: min(490px, calc(100vw - 32px)); max-height: calc(100vh - 104px); box-sizing: border-box;" class="hidden fixed z-40 bg-white/90 backdrop-blur-2xl rounded-2xl border border-white/95 ring-1 ring-slate-900/10 shadow-[0_20px_50px_rgba(15,23,42,0.28)] flex flex-col overflow-hidden text-slate-900 right-popup-enter">
              <!-- Popup Header -->
              <div class="px-4 py-3 bg-gradient-to-r from-amber-50/95 via-white/90 to-orange-50/95 border-b border-slate-200/80 flex items-start justify-between gap-2.5 shrink-0">
                <div class="flex items-start gap-2.5 min-w-0 flex-1">
                  <!-- Creative Yellow Maharashtra RTO Number Plate Badge -->
                  <div id="panelRtoPlate" class="inline-flex items-stretch rounded-[7px] bg-gradient-to-b from-amber-300 via-yellow-400 to-amber-500 border-[1.5px] border-slate-950 shadow-[0_2px_6px_rgba(245,158,11,0.35)] overflow-hidden select-none shrink-0 mt-0.5">
                    <span class="bg-[#0B3B8C] text-white text-[8px] font-black px-1 py-1 flex flex-col items-center justify-center leading-none tracking-tighter">
                      <span class="w-1 h-1 rounded-full bg-amber-300 mb-[2px]"></span>
                      IND
                    </span>
                    <span id="panelRtoCode" class="px-2 py-1 text-slate-950 font-mono font-black text-xs tracking-wider flex items-center whitespace-nowrap">
                      MH 12
                    </span>
                  </div>

                  <!-- District English Name + Line Break + Marathi Name + Tag -->
                  <div class="min-w-0 flex-1">
                    <h2 class="text-lg sm:text-xl font-black text-slate-900 leading-tight break-words">
                      <span id="panelDistrictEn" class="block">Pune</span>
                      <span id="panelDistrictMr" class="inline-block mt-0.5 px-2 py-0.5 rounded bg-amber-100/90 border border-amber-300/80 text-amber-900 font-marathi text-xs sm:text-sm font-bold leading-snug">पुणे</span>
                    </h2>
                    <p id="panelDistrictTag" class="mt-0.5 text-xs font-semibold text-slate-600 truncate">Forts, Lonavala &amp; Karla</p>
                  </div>
                </div>

                <!-- Close Button -->
                <button id="closePlacesOverlayBtn" type="button" aria-label="Close district popup" class="w-7 h-7 rounded-full bg-slate-900/10 hover:bg-slate-900 hover:text-white text-slate-700 font-black text-xs flex items-center justify-center transition shrink-0 cursor-pointer">
                  ✕
                </button>
              </div>

              <!-- Scrollable District Attractions Grid -->
              <div id="panelPlacesBody" class="p-3.5 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2.5 flex-1 min-h-0">
                <!-- Populated dynamically when a district is clicked -->
              </div>
            </aside>
          </div>
        </div>
      </div>
    </div>

    <!-- Animated Road & Moving Tourist Safari Car with Live From -> To All-District Miles Tracker -->
    <div class="relative w-full h-[58px] bg-slate-950 border-t-2 border-b-2 border-amber-400 shadow-[0_-4px_20px_rgba(15,23,42,0.5)] overflow-hidden m-0 p-0 flex items-center justify-between px-2 sm:px-4 z-30 shrink-0">
      <!-- Asphalt Texture & Center Dashed Stripes -->
      <div class="absolute inset-0 bg-slate-900"></div>
      <div class="absolute top-1/2 left-0 right-0 h-1 -translate-y-1/2 road-stripes opacity-85"></div>

      <!-- Moving Tourist Safari Car in Aura White Color -->
      <div class="absolute bottom-1 z-20 road-car-anim flex items-center pointer-events-none">
        <div class="relative flex items-center">
          <!-- Safari Car Body SVG (Aura White Edition) -->
          <svg viewBox="0 0 110 46" class="w-24 h-10 drop-shadow-[0_4px_8px_rgba(0,0,0,0.65)]">
            <!-- Roof Luggage / Carrier -->
            <rect x="25" y="4" width="45" height="4" rx="1.5" fill="#334155"/>
            <rect x="32" y="1" width="12" height="4" rx="1" fill="#F59E0B"/>
            <rect x="48" y="1" width="16" height="4" rx="1" fill="#10B981"/>
            <!-- Car Body (Glossy Aura White with sleek dark trim) -->
            <path d="M10,26 L15,16 Q20,10 32,10 L75,10 Q88,10 94,18 L100,26 L102,34 Q102,38 96,38 L14,38 Q8,38 8,34 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
            <!-- Modern Aura Grille Accent -->
            <path d="M98,28 L102,28 L102,34 L98,34 Z" fill="#0EA5E9"/>
            <!-- Windows -->
            <path d="M30,13 L45,13 L45,24 L22,24 Q24,15 30,13 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
            <path d="M49,13 L75,13 Q78,18 78,24 L49,24 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
            <!-- Headlights & Tail Lights -->
            <rect x="96" y="27" width="4" height="6" rx="1" fill="#FEF08A"/>
            <rect x="3" y="28" width="5" height="5" rx="1.5" fill="#EF4444"/>
            <!-- Maharashtra RTO Number Plate on Car -->
            <rect x="70" y="28" width="20" height="7" rx="1" fill="#FACC15" stroke="#0F172A" stroke-width="0.8"/>
            <text id="carRtoText" x="80" y="33.5" font-size="4.5" font-weight="900" fill="#0F172A" text-anchor="middle">MH 12</text>
            <!-- Wheels with Alloy rims -->
            <circle cx="28" cy="38" r="7.5" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
            <circle cx="28" cy="38" r="2.5" fill="#E2E8F0"/>
            <circle cx="82" cy="38" r="7.5" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
            <circle cx="82" cy="38" r="2.5" fill="#E2E8F0"/>
          </svg>
        </div>
      </div>

      <!-- Interactive From -> To 36-District Distance & Miles Tracker Control Bar -->
      <div class="relative z-20 mx-auto flex items-center gap-1.5 sm:gap-2.5 bg-slate-950/90 backdrop-blur-md border border-amber-400/70 rounded-full px-2.5 sm:px-4 py-1 shadow-[0_4px_16px_rgba(0,0,0,0.65)]">
        <div class="flex items-center gap-1">
          <span class="text-[10px] font-black uppercase tracking-wider text-emerald-400 hidden sm:inline">From</span>
          <select id="fromDistrictSelect" aria-label="From District" class="bg-slate-800 hover:bg-slate-700 text-white text-[11px] sm:text-xs font-bold rounded-full px-2 py-0.5 border border-slate-600 focus:outline-none focus:border-amber-400 cursor-pointer max-w-[115px] sm:max-w-[145px]">
          </select>
        </div>

        <button id="swapDistrictsBtn" type="button" title="Swap From & To Districts" class="w-6 h-6 rounded-full bg-amber-400/20 hover:bg-amber-400 text-amber-300 hover:text-slate-950 text-xs font-black flex items-center justify-center transition cursor-pointer shrink-0">⇄</button>

        <div class="flex items-center gap-1">
          <span class="text-[10px] font-black uppercase tracking-wider text-amber-400 hidden sm:inline">To</span>
          <select id="toDistrictSelect" aria-label="To District" class="bg-slate-800 hover:bg-slate-700 text-white text-[11px] sm:text-xs font-bold rounded-full px-2 py-0.5 border border-slate-600 focus:outline-none focus:border-amber-400 cursor-pointer max-w-[115px] sm:max-w-[145px]">
          </select>
        </div>

        <div class="h-4 w-[1px] bg-slate-700 mx-0.5"></div>

        <!-- Live Odometer KM Readout -->
        <div class="flex items-center gap-1.5 sm:gap-2 whitespace-nowrap">
          <span class="px-2.5 py-0.5 rounded-full bg-amber-400 text-slate-950 text-[11px] sm:text-xs font-black tracking-tight shadow-xs">
            <span id="trackerKmVal">89</span> KM
          </span>
          <span id="trackerDriveTime" class="hidden md:inline-block text-[11px] font-bold text-amber-300">
            (~1h 51m)
          </span>
        </div>

    // -------------------------------------------------------------------------
    // ALL-DISTRICT DISTANCE & MILES TRACKER (HAVERSINE + SAHYADRI ROAD FACTOR)
    // -------------------------------------------------------------------------
    function calculateDistrictDistance(fromId, toId) {
      const d1 = getDistrict(fromId);
      const d2 = getDistrict(toId);
      if (!d1 || !d2 || d1.id === d2.id) {
        return { miles: 0, km: 0, hours: 0, mins: 0 };
      }
      const toRad = deg => (deg * Math.PI) / 180;
      const [lon1, lat1] = d1.coords;
      const [lon2, lat2] = d2.coords;
      const R_KM = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      // 1.26x road winding factor for Maharashtra highways & ghats
      const roadKm = Math.max(12, Math.round(R_KM * c * 1.26));
      const roadMiles = Math.max(7, Math.round(roadKm * 0.621371));
      const totalMins = Math.round((roadKm / 48) * 60);
      return {
        miles: roadMiles,
        km: roadKm,
        hours: Math.floor(totalMins / 60),
        mins: totalMins % 60
      };
    }

    function updateMilesTracker(syncDropdowns = true) {
      const fromSel = document.getElementById('fromDistrictSelect');
      const toSel = document.getElementById('toDistrictSelect');
      if (syncDropdowns && fromSel && toSel) {
        fromSel.value = appState.fromDistrictId;
        toSel.value = appState.toDistrictId;
      }

      const { km, hours, mins } = calculateDistrictDistance(appState.fromDistrictId, appState.toDistrictId);
      const kmEl = document.getElementById('trackerKmVal');
      const timeEl = document.getElementById('trackerDriveTime');
      const carRtoEl = document.getElementById('carRtoText');

      if (kmEl) kmEl.textContent = km.toLocaleString();
      if (timeEl) {
        timeEl.textContent = km === 0 ? '(Same District)' : `(~${hours}h ${mins}m)`;
      }

      const fromDist = getDistrict(appState.fromDistrictId);
      const toDist = getDistrict(appState.toDistrictId);
      if (carRtoEl && fromDist && fromDist.rto) {
        carRtoEl.textContent = fromDist.rto.split('/')[0].trim();
      }

      drawTrackerRouteOnMap();
    }

    function drawTrackerRouteOnMap() {
      if (!mapRoot || !projection) return;
      mapRoot.selectAll('g.safari-tracker-route').remove();

      const d1 = getDistrict(appState.fromDistrictId);
      const d2 = getDistrict(appState.toDistrictId);
      if (!d1 || !d2 || d1.id === d2.id) return;

      const p1 = projection(d1.coords);
      const p2 = projection(d2.coords);
      if (!p1 || !p2 || isNaN(p1[0]) || isNaN(p2[0])) return;

      const midX = (p1[0] + p2[0]) / 2;
      const midY = (p1[1] + p2[1]) / 2 - 22;

      const routeG = mapRoot.append('g').attr('class', 'safari-tracker-route').style('pointer-events', 'none');
      routeG.append('path')
        .attr('class', 'safari-route-line')
        .attr('d', `M${p1[0]},${p1[1]} Q${midX},${midY} ${p2[0]},${p2[1]}`);

      routeG.append('circle')
        .attr('cx', p1[0]).attr('cy', p1[1]).attr('r', 5)
        .attr('fill', '#10B981').attr('stroke', '#FFFFFF').attr('stroke-width', 1.8);

      routeG.append('circle')
        .attr('cx', p2[0]).attr('cy', p2[1]).attr('r', 5.5)
        .attr('fill', '#F59E0B').attr('stroke', '#0F172A').attr('stroke-width', 1.8);
    }

    function getDistrict(id) {
      return MAHARASHTRA_DISTRICTS.find(d => d.id === id) || MAHARASHTRA_DISTRICTS[0];
    }

    function normalizeStr(s) {
      return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function matchDistrictByName(rawName) {
      const norm = normalizeStr(rawName);
      if (!norm) return null;
      if (norm.includes('sambhaji') || norm.includes('aurangabad')) {
        return MAHARASHTRA_DISTRICTS.find(d => d.id === 'chhatrapati_sambhajinagar') || null;
      }
      // Direct or alias exact match first
      const exact = MAHARASHTRA_DISTRICTS.find(d =>
        normalizeStr(d.name) === norm || (d.aliases || []).some(a => normalizeStr(a) === norm)
      );
      if (exact) return exact;
      // Partial fallback match across both name and aliases
      return MAHARASHTRA_DISTRICTS.find(d =>
        norm.includes(normalizeStr(d.name)) ||
        normalizeStr(d.name).includes(norm) ||
        (d.aliases || []).some(a => {
          const normAlias = normalizeStr(a);
          return normAlias.length >= 4 && (norm.includes(normAlias) || normAlias.includes(norm));
        })
      ) || null;
    }

    function renderBaseCartography(width, height) {
      if (!projection) return;
      const gridG = mapRoot.append('g').style('pointer-events', 'none');

      // Subtle Latitude / Longitude Cartographic Graticule Grid
      const graticule = d3.geoGraticule().step([1.5, 1.5]);
      const gratPath = d3.geoPath().projection(projection);
      gridG.append('path')
        .datum(graticule())
        .attr('class', 'graticule-line')
        .attr('d', gratPath);

      const [sx, sy] = projection([72.25, 17.65]);
      gridG.append('text')
        .attr('x', sx).attr('y', sy)
        .attr('transform', `rotate(-72, ${sx}, ${sy})`)
        .attr('fill', '#0284C7').attr('opacity', 0.45)
        .attr('font-size', '12px').attr('font-weight', '900').attr('letter-spacing', '6px')
        .attr('text-anchor', 'middle').text('ARABIAN SEA');

      // Render National Highways (NH 48, NH 52, NH 60, NH 160)
      const highways = [
        { code: 'NH 48', pts: [[72.85, 18.96], [73.20, 18.65], [73.85, 18.52], [74.02, 17.68], [74.24, 16.70], [74.57, 16.85]] }, // Mumbai - Pune - Kolhapur
        { code: 'NH 160', pts: [[72.85, 19.12], [73.03, 19.22], [73.79, 20.00], [74.74, 19.09], [75.34, 19.88]] }, // Mumbai - Nashik - Sambhajinagar
        { code: 'NH 60', pts: [[73.79, 20.00], [74.00, 18.52], [75.00, 18.00]] }, // Nashik - Pune - Solapur
        { code: 'NH 52', pts: [[74.74, 19.09], [75.34, 19.88], [75.90, 17.66], [76.04, 18.18]] } // Northern to Southern MH Axis
      ];

      const lineGen = d3.line()
        .x(d => projection(d)[0])
        .y(d => projection(d)[1])
        .curve(d3.curveNatural);

      const nhGroup = gridG.append('g').attr('class', 'national-highways');
      highways.forEach(hw => {
        const coords = hw.pts.map(pt => projection(pt));
        if (coords.some(c => isNaN(c[0]) || isNaN(c[1]))) return;

        nhGroup.append('path')
          .datum(hw.pts)
          .attr('class', 'nh-highway-line')
          .attr('d', lineGen);

        // Highway Shield Marker at midpoint
        const midPt = coords[Math.floor(coords.length / 2)];
        if (midPt) {
          nhGroup.append('rect')
            .attr('x', midPt[0] - 14)
            .attr('y', midPt[1] - 7)
            .attr('width', 28)
            .attr('height', 14)
            .attr('rx', 3)
            .attr('fill', '#DC2626')
            .attr('stroke', '#FFFFFF')
            .attr('stroke-width', 1);

          nhGroup.append('text')
            .attr('x', midPt[0])
            .attr('y', midPt[1] + 2.5)
            .attr('class', 'nh-shield')
            .text(hw.code);
        }
      });
    }

      const width = Math.max(320, Math.round(rect.width) || container.clientWidth || window.innerWidth || 900);
      const height = Math.max(420, Math.round(rect.height) || container.clientHeight || (window.innerHeight - 66) || 640);

      svgEl = d3.select('#maharashtraSvg')
        .attr('viewBox', `0 0 ${width} ${height}`)
        .attr('preserveAspectRatio', 'xMidYMid meet');

      svgEl.selectAll('*').remove();
      mapRoot = svgEl.append('g');

      // If exact GeoJSON is already cached in memory or localStorage, render immediately without network delay
      if (cachedExactGeoJson) {
        drawGeoJsonFeatures(cachedExactGeoJson, width, height);
        return;
      }

      try {
        const stored = localStorage.getItem('mh_exact_geojson_v1');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.features && parsed.features.length >= 30) {
            cachedExactGeoJson = parsed;
            drawGeoJsonFeatures(cachedExactGeoJson, width, height);
            return;
          }
        }
      } catch (e) {
        // Ignore storage errors in restricted environments
      }

      // Instant fixed geographic Voronoi clipped inside high-detail Maharashtra state polygon (works 100% offline/on any network)
      renderVoronoiMap(width, height);
      updateMapStyling();
      updateLabelPlacement();
      drawTrackerRouteOnMap();

      // Upgrade seamlessly to exact administrative TopoJSON boundaries across multiple CDN mirrors
      upgradeToExactTopoJson(width, height);

        .append('path')
        .attr('class', 'district-path')
        .attr('data-district-id', d => d.id)
        .attr('d', (d, i) => voronoi.renderCell(i))
        .attr('fill', d => d.fillColor)
        .on('click', function (event, d) {
          event.stopPropagation();
          appState.isLocked = true;
          renderDistrictPlacesList(d.id, true, true, true);
        });

      // Crisp State Outline
      mapRoot.append('path')
        .attr('d', pathGen(boundaryGeo))
        .attr('fill', 'none')
        .attr('stroke', '#0B192C')
        .attr('stroke-width', 2.2)
        .attr('vector-effect', 'non-scaling-stroke')
        .style('pointer-events', 'none');

      // District Icons & Full Names
      mapRoot.selectAll('text.district-famous-icon')
        .data(MAHARASHTRA_DISTRICTS)
        .enter()
        .append('text')
        .attr('class', 'district-famous-icon')
        .attr('x', (d, i) => points[i][0])
        .attr('y', (d, i) => points[i][1])
        .text(d => '');

      mapRoot.selectAll('text.district-label')
        .data(MAHARASHTRA_DISTRICTS)
        .enter()
        .append('text')
        .attr('class', 'district-label')
        .attr('x', (d, i) => points[i][0])
        .attr('y', (d, i) => points[i][1])
        .text(d => d.name);
    }

    function drawGeoJsonFeatures(geo, width, height) {
      if (!geo || !geo.features || geo.features.length < 30) return;

      const features = geo.features;
      const rightReserve = window.innerWidth >= 1024 ? Math.min(510, Math.round(width * 0.39)) : 15;
      projection = d3.geoMercator().fitExtent([[12, 10], [Math.max(320, width - rightReserve), height - 20]], geo);
      const pathGen = d3.geoPath().projection(projection);

      mapRoot.selectAll('*').remove();
      renderBaseCartography(width, height);

      // Ensure topographic filter exists after SVG clear
      let defs = svgEl.select('defs');
      if (defs.empty()) defs = svgEl.append('defs');
      if (defs.select('#districtInnerBevel').empty()) {
        const bevelFilter = defs.append('filter')
          .attr('id', 'districtInnerBevel')
          .attr('x', '-5%').attr('y', '-5%').attr('width', '110%').attr('height', '110%');
        bevelFilter.append('feDropShadow')
          .attr('dx', 0).attr('dy', 1.2).attr('stdDeviation', 1.2)
          .attr('flood-color', '#0F172A').attr('flood-opacity', 0.14);
      }

      // Coastal Sea-Breeze Aura & 3D Relief Drop Shadow under Maharashtra
      mapRoot.append('path')
        .attr('d', pathGen(geo))
        .attr('class', 'coastal-glow-outline');

      mapRoot.append('path')
        .attr('d', pathGen(geo))
        .attr('fill', '#64748B')
        .attr('opacity', 0.35)
        .attr('transform', 'translate(5, 7)')
        .style('pointer-events', 'none');

      const enriched = features.map((f, idx) => {
        const p = f.properties || {};
        const candidateProps = [p.NAME_2, p.district, p.DISTRICT, p.dtname, p.DIST_NAME, p.Name, p.name];
        let district = null;
        let rawName = '';
        for (const val of candidateProps) {
          if (typeof val === 'string' && val.trim()) {
            if (!rawName) rawName = val.trim();
            const matched = matchDistrictByName(val);
            if (matched) {
              district = matched;
              break;
            }
          }
        }
        // Coordinate proximity fallback so every TopoJSON polygon gets its exact district color & name
        if (!district) {
          const c = d3.geoCentroid(f);
          if (c && !isNaN(c[0]) && !isNaN(c[1])) {
            let minDist = Infinity;
            MAHARASHTRA_DISTRICTS.forEach(d => {
              const distSq = Math.pow(d.coords[0] - c[0], 2) + Math.pow(d.coords[1] - c[1], 2);
              if (distSq < minDist) {
                minDist = distSq;
                district = d;
              }
            });
          }
        }
        const fallbackColor = DISTRICT_COLORS[idx % DISTRICT_COLORS.length];
        return { feature: f, district, fallbackColor, rawName };
      });

      mapRoot.selectAll('path.district-path')
        .data(enriched)
        .enter()
        .append('path')
        .attr('class', 'district-path')
        .attr('data-district-id', d => d.district ? d.district.id : '')
        .attr('d', d => pathGen(d.feature))
        .attr('fill', d => d.district ? d.district.fillColor : d.fallbackColor)
        .on('click', function (event, d) {
          event.stopPropagation();
          if (!d.district) return;
          appState.isLocked = true;
          renderDistrictPlacesList(d.district.id, true, true, true);
        });

      // Group polygons per district and place the icon & name at the largest polygon's centroid
      const byDistrict = new Map();
      enriched.forEach(d => {
        if (!d.district) return;
        const area = d3.geoArea(d.feature);
        const existing = byDistrict.get(d.district.id);
        if (!existing || area > existing.area) {
          const c = pathGen.centroid(d.feature);
          if (!isNaN(c[0]) && !isNaN(c[1])) {
            byDistrict.set(d.district.id, { district: d.district, x: c[0], y: c[1], area });
          }
        }
      });
      const centroids = Array.from(byDistrict.values());

      mapRoot.selectAll('text.district-famous-icon')
        .data(centroids)
        .enter()
        .append('text')
        .attr('class', 'district-famous-icon')
        .attr('x', d => d.x)
        .attr('y', d => d.y)
        .text(d => '');

      mapRoot.selectAll('text.district-label')
        .data(centroids)
        .enter()
        .append('text')
        .attr('class', 'district-label')
        .attr('x', d => d.x)
        .attr('y', d => d.y)
        .text(d => d.district.name);

      updateMapStyling();
      updateLabelPlacement();
      drawTrackerRouteOnMap();
    }

    async function fetchWithTimeout(url, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal, cache: 'force-cache' });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function upgradeToExactTopoJson(width, height) {
      // Multiple independent CDN mirrors (jsDelivr, Statically, GitHub Raw) so networks blocking raw.githubusercontent.com still load the exact map
      const mirrors = [
        {
          type: 'topo',
          url: 'https://cdn.jsdelivr.net/gh/shuklaneerajdev/IndiaStateTopojsonFiles@master/Maharashtra.topojson'
        },
        {
          type: 'topo',
          url: 'https://cdn.jsdelivr.net/gh/udit-001/india-maps-data@main/topojson/states/maharashtra.json'
        },
        {
          type: 'topo',
          url: 'https://cdn.statically.io/gh/shuklaneerajdev/IndiaStateTopojsonFiles/master/Maharashtra.topojson'
        },
        {
          type: 'topo',
          url: 'https://raw.githubusercontent.com/shuklaneerajdev/IndiaStateTopojsonFiles/master/Maharashtra.topojson'
        },
        {
          type: 'topo',
          url: 'https://raw.githubusercontent.com/udit-001/india-maps-data/main/topojson/states/maharashtra.json'
        }
      ];

      for (const src of mirrors) {
        try {
          const data = await fetchWithTimeout(src.url, 8500);
          let geo = null;
          if (src.type === 'topo' && data && data.objects) {
            const objKey = Object.keys(data.objects)[0];
            geo = topojson.feature(data, data.objects[objKey]);
          } else if (data && data.features) {
            geo = data;
          }

          if (geo && geo.features && geo.features.length >= 30) {
            cachedExactGeoJson = geo;
            try {
              localStorage.setItem('mh_exact_geojson_v1', JSON.stringify(geo));
            } catch (storageErr) {
              // Ignore quota errors
            }

            // Use current container dimensions in case the user resized while fetching
            const container = document.getElementById('mapContainer');
            const currW = Math.max(320, Math.round(container.getBoundingClientRect().width) || width);
            const currH = Math.max(420, Math.round(container.getBoundingClientRect().height) || height);
            svgEl.attr('viewBox', `0 0 ${currW} ${currH}`);

            drawGeoJsonFeatures(geo, currW, currH);
            return;
          }
        } catch (err) {
          // Try next CDN mirror automatically
        }
      }

      // If all external CDNs are blocked on this network, keep the high-detail built-in map smoothly
      showMapNetworkBadge('Offline Map Mode Active', true);
      drawTrackerRouteOnMap();
    }

    function updateMapStyling() {
      if (!mapRoot) return;
      if (svgEl) {
        svgEl.classed('selection-locked', appState.isLocked);
      }
      const cat = appState.selectedCategory;
      const isFiltering = cat !== 'all';

      const matchingIds = new Set();
      MAHARASHTRA_DISTRICTS.forEach(d => {
        if (!isFiltering || (d.places[cat] && d.places[cat].length > 0)) {
          matchingIds.add(d.id);
        }
      });

      mapRoot.selectAll('path.district-path')
        .classed('active-selected', function () {
          return this.getAttribute('data-district-id') === appState.selectedDistrictId;
        })
        .classed('dimmed', function () {
          return isFiltering && !matchingIds.has(this.getAttribute('data-district-id'));
        });

      mapRoot.selectAll('path.district-path.active-selected').raise();
      mapRoot.selectAll('text.district-famous-icon').raise();
      mapRoot.selectAll('text.district-label').raise();

      mapRoot.selectAll('text.district-famous-icon')
        .style('opacity', d => {
          if (!appState.showIcons) return 0;
          const id = d.district ? d.district.id : d.id;
          return isFiltering && !matchingIds.has(id) ? 0.2 : 1;
        });

      mapRoot.selectAll('text.district-label')
        .style('opacity', d => {
          if (!appState.showNames) return 0;
          const id = d.district ? d.district.id : d.id;
          return isFiltering && !matchingIds.has(id) ? 0.2 : 1;
        });

      const badge = document.getElementById('activeCategoryBadge');
      if (isFiltering) {
        const catObj = PLACE_CATEGORIES.find(c => c.key === cat);
        badge.textContent = `Theme: ${catObj ? catObj.label : cat} (${matchingIds.size} Districts)`;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // -------------------------------------------------------------------------
    // RENDER RIGHT-SIDE DISTRICT PLACES POPUP
    // -------------------------------------------------------------------------
    function closeDistrictPopup() {
      const panelEl = document.getElementById('districtPlacesPanel');
      const welcomeEl = document.getElementById('welcomeBrandBanner');
      if (panelEl) panelEl.classList.add('hidden');
      if (welcomeEl) welcomeEl.classList.remove('hidden');
      appState.selectedDistrictId = null;
      appState.isLocked = false;
      updateMapStyling();
    }

    function renderDistrictPlacesList(districtId, animatePanel = true, openPopup = true, lockSelection = false) {
      const district = getDistrict(districtId);
      if (!district) return;

      appState.selectedDistrictId = district.id;
      if (lockSelection) {
        appState.isLocked = true;
      }

      // Sync destination in the From -> To KM tracker
      appState.toDistrictId = district.id;
      updateMilesTracker(true);

      const panelEl = document.getElementById('districtPlacesPanel');
      const rtoCodeEl = document.getElementById('panelRtoCode');
      const districtEnEl = document.getElementById('panelDistrictEn');
      const districtMrEl = document.getElementById('panelDistrictMr');
      const districtTagEl = document.getElementById('panelDistrictTag');
      const bodyEl = document.getElementById('panelPlacesBody');

      if (!panelEl || !bodyEl) return;

      if (rtoCodeEl) rtoCodeEl.textContent = district.rto || 'MH';
      if (districtEnEl) districtEnEl.textContent = district.name;
      if (districtMrEl) districtMrEl.textContent = district.marathi;
      if (districtTagEl) districtTagEl.textContent = district.tag || 'Maharashtra Heritage & Nature';

      // Build attraction category cards
      const cardsHtml = PLACE_CATEGORIES.map(cat => {
        const items = district.places[cat.key];
        if (!items || items.length === 0) return '';
        const isHighlighted = appState.selectedCategory === cat.key;
        return `
          <div class="rounded-xl p-3 bg-white/95 border ${isHighlighted ? 'border-amber-400 ring-2 ring-amber-300/60' : 'border-slate-200/90'} shadow-xs flex flex-col gap-1.5">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
                <span class="text-xs font-black uppercase tracking-wider text-slate-900 truncate">${cat.label}</span>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-black ${cat.badge} border shrink-0">${items.length}</span>
            </div>
            <p class="text-xs sm:text-[13px] font-medium text-slate-700 leading-relaxed">
              ${items.join(', ')}
            </p>
          </div>
        `;
      }).filter(Boolean).join('');

      bodyEl.innerHTML = cardsHtml || `
        <div class="col-span-full text-center py-6 text-sm font-semibold text-slate-500">
          Explore scenic attractions across ${district.name}.
        </div>
      `;

      updateMapStyling();

      if (openPopup) {
        const welcomeEl = document.getElementById('welcomeBrandBanner');
        if (welcomeEl) welcomeEl.classList.add('hidden');
        panelEl.classList.remove('hidden');
        if (animatePanel) {
          panelEl.classList.remove('middle-right-flash');
          void panelEl.offsetWidth;
          panelEl.classList.add('middle-right-flash');
        }
      }
    }

    // -------------------------------------------------------------------------
    // INITIALIZE CONTROLS & EVENT LISTENERS
    // -------------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      // Close Right-Side Info Popup (Header ✕, Backdrop Click, or Esc key)
      const closeOverlayBtn = document.getElementById('closePlacesOverlayBtn');
      if (closeOverlayBtn) {
        closeOverlayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeDistrictPopup();
        });
      }

      document.getElementById('maharashtraSvg').addEventListener('click', (e) => {
        // Only close when clicking empty background SVG space, never when clicking a district path
        if (!e.target.closest('.district-path')) {
          closeDistrictPopup();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDistrictPopup();
      });
      // Initialize Miles Tracker & Map
      initMilesTrackerDropdowns();
      initMaharashtraMap();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => initMaharashtraMap(), 250);
      });
    });
  </script>
